# Authentication - Google OAuth Tests
# Tests for Google OAuth login flow

name: Google OAuth Tests
description: Test Google OAuth authentication flow

tests:
  - name: Google OAuth - Initiate Sign-in
    description: Test initiating Google OAuth sign-in flow
    request:
      method: GET
      url: ${BACKEND_URL}/api/auth/signin/google
      headers:
        Accept: text/html
      query:
        callbackUrl: ${FRONTEND_URL}/profile
    assertions:
      - type: status_code
        expected: 302  # Redirect to Google
      - type: header
        name: Location
        contains: accounts.google.com
      - type: header
        name: Location
        contains: client_id

  - name: Google OAuth - CSRF Token
    description: Test CSRF token endpoint for OAuth
    request:
      method: GET
      url: ${BACKEND_URL}/api/auth/csrf
      headers:
        Accept: application/json
    assertions:
      - type: status_code
        expected: 200
      - type: json_path
        path: $.csrfToken
        exists: true
        type: string

  # Note: Full OAuth callback testing requires actual Google OAuth flow
  # These tests verify the initiation endpoints work correctly
