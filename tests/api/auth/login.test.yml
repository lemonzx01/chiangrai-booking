# Authentication - Login Tests
# Tests for POST /api/auth/login endpoint

name: Authentication Login Tests
description: Test user and admin login functionality

tests:
  - name: User Login - Success
    description: Test successful user login with valid credentials
    request:
      method: POST
      url: ${BACKEND_URL}/api/auth/login
      headers:
        Content-Type: application/json
      body:
        email: ${TEST_USER_EMAIL}
        password: ${TEST_USER_PASSWORD}
    assertions:
      - type: status_code
        expected: 200
      - type: json_path
        path: $.user.email
        expected: ${TEST_USER_EMAIL}
      - type: json_path
        path: $.user.role
        expected: user
      - type: cookie_exists
        name: user_token
        httpOnly: true
      - type: response_time
        max: 2000

  - name: Admin Login - Success
    description: Test successful admin login with valid credentials
    request:
      method: POST
      url: ${BACKEND_URL}/api/auth/login
      headers:
        Content-Type: application/json
      body:
        email: ${TEST_ADMIN_EMAIL}
        password: ${TEST_ADMIN_PASSWORD}
    assertions:
      - type: status_code
        expected: 200
      - type: json_path
        path: $.user.email
        expected: ${TEST_ADMIN_EMAIL}
      - type: json_path
        path: $.user.role
        expected: admin
      - type: cookie_exists
        name: admin_token
        httpOnly: true

  - name: Login - Invalid Email
    description: Test login with invalid email format
    request:
      method: POST
      url: ${BACKEND_URL}/api/auth/login
      headers:
        Content-Type: application/json
      body:
        email: invalid-email
        password: ${TEST_USER_PASSWORD}
    assertions:
      - type: status_code
        expected: 400

  - name: Login - Missing Password
    description: Test login without password
    request:
      method: POST
      url: ${BACKEND_URL}/api/auth/login
      headers:
        Content-Type: application/json
      body:
        email: ${TEST_USER_EMAIL}
    assertions:
      - type: status_code
        expected: 400
      - type: json_path
        path: $.error
        contains: password

  - name: Login - Wrong Password
    description: Test login with incorrect password
    request:
      method: POST
      url: ${BACKEND_URL}/api/auth/login
      headers:
        Content-Type: application/json
      body:
        email: ${TEST_USER_EMAIL}
        password: wrongpassword
    assertions:
      - type: status_code
        expected: 401
      - type: json_path
        path: $.error
        contains: password

  - name: Login - Non-existent User
    description: Test login with email that doesn't exist
    request:
      method: POST
      url: ${BACKEND_URL}/api/auth/login
      headers:
        Content-Type: application/json
      body:
        email: nonexistent@example.com
        password: ${TEST_USER_PASSWORD}
    assertions:
      - type: status_code
        expected: 401
