# Bookings API - Create Tests
# Tests for POST /api/bookings endpoint

name: Bookings Create Tests
description: Test booking creation functionality

setup:
  # Login as user first to get auth token
  - name: Login User
    request:
      method: POST
      url: ${BACKEND_URL}/api/auth/login
      headers:
        Content-Type: application/json
      body:
        email: ${TEST_USER_EMAIL}
        password: ${TEST_USER_PASSWORD}
    extract:
      cookie: user_token
      variable: auth_cookie

tests:
  - name: Create Booking - Success
    description: Test successful booking creation
    request:
      method: POST
      url: ${BACKEND_URL}/api/bookings
      headers:
        Content-Type: application/json
        Cookie: ${auth_cookie}
      body:
        hotel_id: mock-hotel-1
        room_type_id: mock-room-type-1
        check_in: "2024-12-25"
        check_out: "2024-12-27"
        guests: 2
        guest_name: "Test User"
        guest_email: ${TEST_USER_EMAIL}
        guest_phone: "0812345678"
    assertions:
      - type: status_code
        expected: 201
      - type: json_path
        path: $.booking.code
        exists: true
        type: string
      - type: json_path
        path: $.booking.status
        expected: PENDING
      - type: json_path
        path: $.booking.total_price
        type: number
        min: 0

  - name: Create Booking - Missing Required Fields
    description: Test booking creation without required fields
    request:
      method: POST
      url: ${BACKEND_URL}/api/bookings
      headers:
        Content-Type: application/json
        Cookie: ${auth_cookie}
      body:
        hotel_id: mock-hotel-1
        # Missing check_in, check_out, etc.
    assertions:
      - type: status_code
        expected: 400

  - name: Create Booking - Invalid Dates
    description: Test booking with check_out before check_in
    request:
      method: POST
      url: ${BACKEND_URL}/api/bookings
      headers:
        Content-Type: application/json
        Cookie: ${auth_cookie}
      body:
        hotel_id: mock-hotel-1
        room_type_id: mock-room-type-1
        check_in: "2024-12-27"
        check_out: "2024-12-25"  # Invalid: check_out before check_in
        guests: 2
        guest_name: "Test User"
        guest_email: ${TEST_USER_EMAIL}
        guest_phone: "0812345678"
    assertions:
      - type: status_code
        expected: 400

  - name: Create Booking - Unauthorized
    description: Test booking creation without authentication
    request:
      method: POST
      url: ${BACKEND_URL}/api/bookings
      headers:
        Content-Type: application/json
      body:
        hotel_id: mock-hotel-1
        room_type_id: mock-room-type-1
        check_in: "2024-12-25"
        check_out: "2024-12-27"
        guests: 2
    assertions:
      - type: status_code
        expected: 401
